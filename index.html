<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Just For You</title>
  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#ffd6e0;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      text-align:center;
    }
    .screen{width:100%}
    .heart-btn{
      font-size:48px;
      cursor:pointer;
      animation:pulse 1.5s infinite;
    }
    @keyframes pulse{
      0%{transform:scale(1)}
      50%{transform:scale(1.2)}
      100%{transform:scale(1)}
    }
    .circle{
      width:200px;height:200px;
      border:4px solid #ff5c8a;
      border-radius:50%;
      margin:20px auto;
      position:relative;
    }
    .line{
      width:100%;height:4px;
      background:#ff5c8a;
      position:absolute;
      top:50%;
      animation:scan 1.5s infinite;
    }
    @keyframes scan{
      0%{top:0}
      50%{top:50%}
      100%{top:100%}
    }
    .card{
      background:#fff;
      padding:20px;
      border-radius:16px;
      max-width:300px;
      margin:auto;
    }
    button{
      padding:10px 20px;
      border:none;
      border-radius:20px;
      background:#ff5c8a;
      color:#fff;
      font-size:16px;
      cursor:pointer;
      margin-top:10px;
    }
    .envelope{font-size:60px;cursor:pointer}
    .panda{font-size:80px}
  </style>
</head>

<body>
<div class="screen" id="screen">
  <h1>Just for you</h1>
  <div class="heart-btn" onclick="scan()">❤️</div>
  <p>Tap to open</p>
</div>

<script>
const screen=document.getElementById("screen");

function scan(){
  screen.innerHTML=`
    <div class="circle"><div class="line"></div></div>
    <p id="status">Scanning...</p>
  `;
  const texts=[
    "Scanning...",
    "Detecting cuteness...",
    "Checking smiling...",
    "Almost done..."
  ];
  let i=0;
  const t=setInterval(()=>{
    document.getElementById("status").innerText=texts[i++];
    if(i===texts.length){
      clearInterval(t);
      setTimeout(report,1000);
    }
  },1000);
}

function report(){
  screen.innerHTML=`
    <div class="card">
      <p>Item: You</p>
      <p>Smiling: Unlimited</p>
      <p>Sweetness: Overload</p>
      <p>Vibe: Perfect</p>
      <h3>Total: 100% Lovely</h3>
      <button onclick="letter()">Next</button>
    </div>
  `;
}

function letter(){
  screen.innerHTML=`
    <div class="card">
      <h2>For you</h2>
      <p>
        I wanted to make something special just for you.
        Thank you for being you.
      </p>
      <button onclick="final()">One last thing</button>
    </div>
  `;
}

function final(){
  screen.innerHTML=`
    <div>
      <div class="panda">🐼</div>
      <h2>You are the best</h2>
      <p>Don’t ever forget it</p>
    </div>
  `;
}
</script>
</body>
</html>
