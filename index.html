<!DOCTYPE html>
<html>
<head>
  <title>Forgive Me 🥺</title>
  <style>
    body {
      background: pink;
      text-align: center;
      font-family: Arial, sans-serif;
      padding-top: 100px;
    }
    h1 {
      font-size: 32px;
    }
    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      position: absolute;
    }
    #yes {
      position: relative;
      background: #ff4d6d;
      color: white;
    }
    #no {
      background: white;
    }
  </style>
</head>

<body>
  <h1>Will you forgive me? 🥺💗</h1>

  <button id="yes" onclick="yes()">Accept 💖</button>
  <button id="no" onmouseover="move()">Reject 😤</button>

  <script>
    function move() {
      let x = Math.random() * (window.innerWidth - 100);
      let y = Math.random() * (window.innerHeight - 100);
      document.getElementById("no").style.left = x + "px";
      document.getElementById("no").style.top = y + "px";
    }

    function yes() {
      window.location.href = "final.html";
    }
  </script>
</body>
</html>
